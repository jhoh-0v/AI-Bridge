<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>버튼 위치 연습</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#fffefb;font:14px/1.8 system-ui,sans-serif;color:#3c4e3e;display:flex;flex-direction:column;padding:30px}header{font-size:11px;color:#96a18e}.center{max-width:580px;width:100%;margin:auto;text-align:center;padding:30px 0}.symbol{font-size:34px;color:#8a9b76}h1{font-size:29px;letter-spacing:-1px;margin:15px 0}p{font-size:13px;color:#98a18e}.composer{border:1px solid #dce2d4;border-radius:18px;padding:18px;margin-top:30px;background:#fafbf6;text-align:left}textarea{width:100%;min-height:60px;border:0;background:none;resize:vertical;font:14px system-ui;outline:none}.tools{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.tools button{width:32px;height:32px;border:1px solid #dde4d2;border-radius:50%;background:white;color:#647e51;font-size:22px;cursor:pointer}.tools small{font-size:10px;color:#acb39f}.note{font-size:10px;text-align:center;color:#b1b8a6;margin-top:15px}#feedback{min-height:25px;font-size:12px;color:#8b947d}@media(max-width:700px){body{padding:16px}.center{padding:10px}h1{font-size:20px;margin:3px}p{font-size:11px}.symbol{display:none}.composer{margin-top:12px;padding:10px}textarea{min-height:35px}}</style></head><body><header>AI Bridge · 버튼 위치 연습용 화면</header><div class="center"><div class="symbol">✳</div><h1>실제 화면 옆에서, 한 단계씩.</h1><p>오른쪽 코치에서 ‘첨부 위치’ 또는 ‘입력 위치’를 눌러 보세요.</p><div class="composer"><textarea id="prompt-textarea" placeholder="입력 위치를 확인하는 연습용 입력창"></textarea><div class="tools"><button id="composer-plus-btn" aria-label="파일 추가 위치 연습">+</button><small>실제 요청을 전송하지 않아요</small></div></div><div id="feedback" role="status"></div><div class="note">실습은 설치한 확장 프로그램과 실제 ChatGPT에서 진행하세요.</div></div><script type="module" src="mock.js"></script></body></html>
